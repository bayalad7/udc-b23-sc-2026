; Ajustes locales para desarrollo con Docker — B23 Semana Acádemica, Cultural y Deportiva

upload_max_filesize = 8M
post_max_size = 9M
memory_limit = 256M
date.timezone = America/Mexico_City

; display_errors se deja apagado a propósito: varios endpoints (generación de
; QR/credencial) devuelven binarios (PNG) por HTTP, y un warning impreso antes
; de la imagen corrompería la respuesta. Los errores se registran igual.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
