<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # vendor/ lo regenera Composer (no está versionado, así que no puede
    # depender de un .htaccess propio) y nunca debe ser accesible por HTTP.
    <LocationMatch "^/(.*/)?vendor/">
        Require all denied
    </LocationMatch>
</VirtualHost>
